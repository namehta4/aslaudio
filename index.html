<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASL Audio — Real-Time Speech to ASL Gloss</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>ASL Audio</h1>
    <p class="subtitle">Real-time speech → ASL gloss → sign playback</p>
  </header>

  <main>
    <section class="panel input-panel">
      <div class="mic-row">
        <button id="micButton">🎤 Start Listening</button>
        <span id="micStatus" class="status"></span>
      </div>

      <label class="lang-row">
        Spoken language
        <select id="languageSelect">
          <option value="en" selected>English (fast, native)</option>
          <option value="spanish">Spanish</option>
          <option value="french">French</option>
          <option value="german">German</option>
          <option value="italian">Italian</option>
          <option value="portuguese">Portuguese</option>
          <option value="dutch">Dutch</option>
          <option value="russian">Russian</option>
          <option value="ukrainian">Ukrainian</option>
          <option value="polish">Polish</option>
          <option value="turkish">Turkish</option>
          <option value="arabic">Arabic</option>
          <option value="hebrew">Hebrew</option>
          <option value="hindi">Hindi</option>
          <option value="chinese">Chinese</option>
          <option value="japanese">Japanese</option>
          <option value="korean">Korean</option>
          <option value="vietnamese">Vietnamese</option>
          <option value="thai">Thai</option>
          <option value="indonesian">Indonesian</option>
          <option value="swedish">Swedish</option>
          <option value="norwegian">Norwegian</option>
          <option value="danish">Danish</option>
          <option value="finnish">Finnish</option>
          <option value="greek">Greek</option>
          <option value="czech">Czech</option>
          <option value="romanian">Romanian</option>
          <option value="hungarian">Hungarian</option>
        </select>
      </label>
      <p id="languageNote" class="lang-note" hidden></p>

      <div id="browserWarning" class="browser-warning" hidden></div>

      <form id="typeForm" class="type-form">
        <input id="typeInput" type="text" placeholder="…or type a sentence instead" autocomplete="off" />
        <button type="submit">Send</button>
      </form>

      <div id="interim" class="interim"></div>

      <h2>Transcript</h2>
      <div id="transcriptLog" class="log"></div>

      <h2>ASL Gloss</h2>
      <div id="glossLog" class="log"></div>
    </section>

    <section class="panel stage-panel">
      <div class="stage">
        <div class="stage-layer" data-layer="0">
          <video muted playsinline></video>
          <img alt="ASL sign" />
          <div class="caption"></div>
        </div>
        <div class="stage-layer" data-layer="1">
          <video muted playsinline></video>
          <img alt="ASL sign" />
          <div class="caption"></div>
        </div>
        <p id="signQueue" class="queue-preview"></p>
      </div>

      <div class="controls">
        <label>
          Playback speed
          <input id="speedSlider" type="range" min="0.5" max="2" step="0.1" value="1" />
        </label>
        <label class="checkbox">
          <input id="fingerspellToggle" type="checkbox" />
          Fingerspell unknown words
        </label>
      </div>
    </section>
  </main>

  <footer>
    <p>
      Simplified, rule-based gloss translation for demonstration/educational use — not a
      substitute for a certified ASL interpreter. See <code>README.md</code> for how the
      pipeline works and how to add real sign video clips.
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
